<!DOCTYPE html>
<html lang="en">
    <link rel="stylesheet" href="style.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style</title>
    <style>
        h2{
            color:pink;
            background-color:black;
        }
    </style>
</head>
<body>
    <!-- Cách 1: Inline style-->
     <!-- color: quy định màu chữ-->
      <!-- background-color: quy định màu nền-->
       <h1 style="color: blue; background-color: orange">
        Bài STYLE
       </h1>
       <!-- Cách 2: Internal Style-->
        <h2>Cách 2 Internal Style</h2>
        <style>
            h3{
                color: darkorchid;
                background-color: rgb(243, 171, 185);
            }
        </style>
        <h3>xin chào</h3>
        <!-- Cách 3: External Style-->
         <h4>HUMG</h4>


</body> 
</html>
